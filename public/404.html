<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Quantly</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — redirects a direct/refreshed
      // deep-link request (e.g. /no-code/platform) into a query string that
      // index.html's decoder script below turns back into the real path.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keep the "/no-code" repo segment

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
